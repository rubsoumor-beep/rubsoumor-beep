Boa, achei a origem exata! Aquela imagem que você mandou (Simon Lecoq) foi feita usando o próprio repositório-modelo oficial do criador da ferramenta: lowlighter/lowlighter. Ele é um "template repository" no GitHub — ou seja, você pode literalmente copiar a estrutura toda pronta (workflow + CSS do tema escuro) em vez de configurar tudo manualmente.

Pesquisou na web
Boa notícia: isso não é bug de configuração — é assim que o lowlighter/metrics funciona por padrão! O template "classic" tem suporte nativo a modo claro/escuro automático, baseado no tema do navegador/sistema de quem está olhando (a mesma engenharia dos badges do próprio GitHub).

Ou seja: o card do Simon Lecoq aparece escuro porque ele está navegando no GitHub em modo escuro (dark mode). O seu aparece claro porque você (ou o navegador que tirou o print) está no modo claro.

Teste isso agora:

