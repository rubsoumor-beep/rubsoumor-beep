Metrics · YML
name: Metrics
on:
  # Atualiza automaticamente a cada hora
  schedule: [{ cron: "0 * * * *" }]
  # Permite rodar manualmente pela aba "Actions" e a cada push
  workflow_dispatch:
  push: { branches: ["main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token com escopos: repo, read:user, read:packages, project
          token: ${{ secrets.METRICS_TOKEN }}
          # Token especial do Actions, usado só pra commitar o SVG no repo
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          # Layout maior, estilo painel (config_columns não existe, foi removida)
          config_display: large
          # Base: estatísticas de repositórios, comunidade (sponsors,
          # stargazers, forks, watchers), sem o cabeçalho de bio duplicado
          base: "repositories, community"
          # 🏅 Selo de conquistas
          plugin_achievements: yes
          plugin_achievements_threshold: C
          # 💡 Hábitos de código e atividade recente
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_days: 14
          plugin_habits_from: 200
          # 📅 Calendário de contribuições em 3D (isométrico)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # 🈷️ Linguagens mais usadas
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          # 📌 Tópicos/tecnologias dominadas
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_limit: 20
          # As linhas abaixo estão desligadas por padrão porque dependem
          # de coisas que você ainda não tem configuradas. Depois que
          # tiver, é só trocar "no" por "yes" e preencher os dados.
          # ⏱️ Precisa de um site seu (troque a URL abaixo)
          plugin_pagespeed: no
          # plugin_pagespeed_url: https://seusite.com
          # 🎼 Precisa de conta de música conectada
          plugin_music: no
          # 🗂️ Precisa de um "Project" (clássico) criado no GitHub
          plugin_projects: no
          # 🌙 Força o tema escuro para TODOS os visitantes,
          # independente do tema (claro/escuro) que a pessoa usa no GitHub
          extras_css: |
            svg { background-color: #0d1117 !important; }
            text, tspan { fill: #c9d1d9 !important; }
            h1, h2, h3, .title { fill: #58a6ff !important; }
 


