name: Metrics

on:
  # Atualiza automaticamente a cada hora
  schedule: [{ cron: "0 * * * *" }]
  # Permite rodar manualmente pela aba "Actions" e a cada push
  workflow_dispatch:
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Token com escopos: repo, read:user, read:packages, project
          token: ${{ secrets.METRICS_TOKEN }}
          # Token especial do Actions, usado só pra commitar o SVG no repo
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # ==========================================================
          # Base do template (o que aparece na coluna da esquerda:
          # repositórios, licença, releases, espaço usado, sponsors,
          # stargazers, forks, watchers, contribuições)
          # ==========================================================
          base: "header, activity, community, repositories, metadata"

          # ==========================================================
          # 🏅 Selo de conquistas (o iconezinho no canto do avatar)
          # ==========================================================
          plugin_achievements: yes
          plugin_achievements_threshold: C

          # ==========================================================
          # 💡 Hábitos de código e atividade recente
          # ==========================================================
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_days: 14
          plugin_habits_from: 200

          # ==========================================================
          # 📅 Calendário de contribuições em 3D (isométrico)
          # ==========================================================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ==========================================================
          # 🈷️ Linguagens mais usadas
          # ==========================================================
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # ==========================================================
          # 📌 Tópicos/tecnologias dominadas
          # ==========================================================
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_limit: 20

          # ==========================================================
          # ⏱️ Google PageSpeed Insights (precisa de uma URL pública sua)
          # Troque pela URL do seu site, ex: https://seudominio.com
          # ==========================================================
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://example.com
          plugin_pagespeed_detailed: yes

          # ==========================================================
          # 🎼 Sugestões de música (Apple Music, não precisa de token extra)
          # ==========================================================
          plugin_music: yes
          plugin_music_provider: applemusic
          plugin_music_mode: playlist
          plugin_music_playlist: "" # ID de uma playlist pública da Apple Music (opcional)
          plugin_music_limit: 4

          # ==========================================================
          # 🗂️ Projeto/roadmap (precisa de um "Project" clássico no repo)
          # ==========================================================
          plugin_projects: yes
