Pensou por 2s
Ótima pergunta! Não exatamente — é ao contrário do que você imagina.

Como o card se adapta ao tema de quem está olhando (não ao seu), cada visitante vai ver uma versão diferente automaticamente:

Quem visita seu perfil com o GitHub em modo claro → vê o card claro
Quem visita com o GitHub em modo escuro → vê o card escuro
Ou seja, ativar o modo escuro na sua própria conta só muda o que você vê, não o que os outros veem. Cada pessoa vê a versão que combina com o tema dela.

Se você quer que TODO MUNDO veja sempre escuro (independente do tema de quem visita, igual no exemplo do Simon Lecoq), você precisa forçar isso via CSS, ignorando a preferência do visitante:

Editou um arquivo, leu um arquivo
Cole esse arquivo atualizado no seu metrics.yml e rode o workflow de novo. Aviso importante: os nomes exatos das classes CSS (text, tspan, .title, etc.) podem não bater 100% com a estrutura interna do template — pode ser que alguns elementos não fiquem coloridos direito na primeira tentativa. Se sobrar algum texto escuro sobre fundo escuro (ilegível) depois de rodar, me manda um print que eu ajusto o seletor certo.


