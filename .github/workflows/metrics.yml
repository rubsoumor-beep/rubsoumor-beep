Se depois disso ainda continuar claro (não se adaptou), aí sim é caso de forçar o tema escuro manualmente via CSS, independente de quem está vendo. Nesse caso, adicione isso no seu metrics.yml:

yaml
extras_css: |
  svg, .metrics { background-color: #0d1117 !important; }
  body, text, tspan { fill: #c9d1d9 !important; color: #c9d1d9 !important; }
Teste primeiro a opção do modo escuro do GitHub (é bem provável que resolva sozinho). Me conta o que aconteceu que eu ajusto o CSS certinho se precisar forçar.

